let currentCategory='beauty',lessonIndex=0,itemIndex=0,attempts=0,corrects=0;
let wrong=JSON.parse(localStorage.getItem('interest_english_wrong_v2')||'[]');
let done=JSON.parse(localStorage.getItem('interest_english_done_v2')||'[]');
let learned=new Set(JSON.parse(localStorage.getItem('interest_english_words_v2')||'[]'));
const $=id=>document.getElementById(id);function norm(s){return s.toLowerCase().replace(/[.,!?’']/g,'').replace(/\s+/g,' ').trim()}
function init(){renderCategories();selectCategory('beauty');$('prev-btn').onclick=prev;$('next-btn').onclick=next;$('review-btn').onclick=startReview;updateStats()}
function renderCategories(){let c=$('course-grid');c.innerHTML='';Object.entries(categoryInfo).forEach(([key,x])=>{let count=lessons.filter(l=>l.category===key).length,b=document.createElement('button');b.className='course '+(key===currentCategory?'active':'');b.innerHTML=`<div class="course-icon">${x.icon}</div><h3>${x.course}</h3><p>${x.description}</p><small>${count}本の動画 →</small>`;b.onclick=()=>selectCategory(key);c.appendChild(b)})}
function selectCategory(key){currentCategory=key;renderCategories();renderVideoStrip();let idx=lessons.findIndex(l=>l.category===key);loadLesson(idx)}
function lessonProgress(l){let qs=l.items.map((_,i)=>l.id+'-'+i).filter((_,i)=>l.items[i].kind!=='watch'&&l.items[i].kind!=='reflect');let n=qs.filter(k=>done.includes(k)).length;return qs.length?Math.round(n/qs.length*100):0}
function renderVideoStrip(){let list=lessons.filter(l=>l.category===currentCategory);$('video-list-title').textContent=categoryInfo[currentCategory].label+'の動画';$('video-strip').innerHTML=list.map(l=>`<button class="video-card ${lessons[lessonIndex]?.id===l.id?'active':''}" onclick="loadLesson(${lessons.indexOf(l)})"><b>${l.title}</b><span>${l.sub}・${l.level}</span><div class="mini-progress"><i style="width:${lessonProgress(l)}%"></i></div></button>`).join('')}
function loadLesson(i){lessonIndex=i;currentCategory=lessons[i].category;itemIndex=0;let l=lessons[i];$('lesson-title').textContent=l.title;$('lesson-sub').textContent=l.sub;$('lesson-level').textContent=l.level;$('video').innerHTML=`<iframe id="yt" src="https://www.youtube.com/embed/${l.youtubeId}?rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;renderCategories();renderVideoStrip();renderWords();renderTraining();l.words.filter(w=>w.type==='exam').forEach(w=>learned.add(l.id+':'+w.term));localStorage.setItem('interest_english_words_v2',JSON.stringify([...learned]));updateStats()}
function renderWords(){let l=lessons[lessonIndex];$('word-list').innerHTML=l.words.map(w=>`<div class="word"><div class="word-top"><b>${w.term}</b><span class="importance ${w.type}">${w.type==='exam'?'★ 入試重要':'△ 動画理解'}</span></div><div>${w.meaning}</div></div>`).join('')}
function renderFlow(){let l=lessons[lessonIndex];$('flow').innerHTML=l.items.map((x,i)=>`<span class="step ${i===itemIndex?'on':''}">${x.stage}</span>`).join('')}
function renderTraining(){renderFlow();selected=[];let x=lessons[lessonIndex].items[itemIndex],b=$('training-body');let h=`<div class="stage-label">${x.stage}</div><div class="question">${x.prompt}</div>`;
if(x.kind==='watch')h+=`<div class="scene-text">全部聞き取ろうとせず、映像と話の大筋を楽しみましょう。</div><button class="action" onclick="seek(${x.scene})">▶ ${x.scene}秒付近から見る</button>`;
if(x.kind==='listen')h+=`<div class="scene-text"><strong>${x.masked}</strong></div><div class="listen-tools"><button onclick="speak('${x.sentence.replace(/'/g,"\\'")}')">🔊 例文を聞く</button><button onclick="seek(${x.scene})">▶ 動画の場面を見る</button></div><div class="choices">${x.choices.map((c,i)=>`<button class="choice" onclick="checkChoice(this,${i})">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div>`;
if(x.kind==='choice')h+=`<div class="choices">${x.choices.map((c,i)=>`<button class="choice" onclick="checkChoice(this,${i})">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="explain hidden" id="exp">${x.explain}</div>`;
if(x.kind==='blank')h+=`<div class="scene-text">${x.prompt}</div><div class="answer-input"><input id="answer" autocomplete="off" placeholder="英単語を入力"><button class="primary" onclick="checkText()">判定</button></div><div class="feedback" id="fb"></div><div class="explain">${x.jp}</div>`;
if(x.kind==='order'||x.kind==='build')h+=`<div class="choices" id="tokens">${shuffle([...x.tokens]).map((t,i)=>`<button class="choice" data-token-id="${i}" onclick="pickToken(this)">${t}</button>`).join('')}</div><div class="build-tray empty" id="built"></div><div class="answer-input"><button class="secondary" onclick="resetOrder()">やり直す</button><button class="primary" onclick="checkOrder()">判定</button></div><div class="feedback" id="fb"></div>${x.explain?`<div class="explain hidden" id="exp">${x.explain}</div>`:''}`;
if(x.kind==='reflect')h+=`<div class="choices">${x.examples.map(c=>`<button class="choice" onclick="chooseReflection(this)">${c}</button>`).join('')}</div><div class="reflection">${x.tip}</div><div class="feedback" id="fb"></div>`;
b.innerHTML=`<span class="tag">${x.title}</span>${h}`;$('prev-btn').disabled=itemIndex===0;$('next-btn').textContent=itemIndex===lessons[lessonIndex].items.length-1?'この動画を完了':'次へ'}
function seek(s){let l=lessons[lessonIndex],f=$('yt');f.src=`https://www.youtube.com/embed/${l.youtubeId}?start=${s}&autoplay=1&rel=0`}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;window.speechSynthesis.speak(u)}
function record(ok){attempts++;if(ok)corrects++;let key=lessons[lessonIndex].id+'-'+itemIndex;if(ok){if(!done.includes(key))done.push(key);wrong=wrong.filter(k=>k!==key)}else if(!wrong.includes(key))wrong.push(key);localStorage.setItem('interest_english_done_v2',JSON.stringify(done));localStorage.setItem('interest_english_wrong_v2',JSON.stringify(wrong));renderVideoStrip();updateStats()}
function checkChoice(el,i){let x=lessons[lessonIndex].items[itemIndex];document.querySelectorAll('#training-body .choice').forEach(e=>e.disabled=true);let ok=i===x.answer;el.classList.add(ok?'correct':'wrong');if(!ok)document.querySelectorAll('#training-body .choice')[x.answer].classList.add('correct');showFeedback(ok);if($('exp'))$('exp').classList.remove('hidden');record(ok)}
function checkText(){let x=lessons[lessonIndex].items[itemIndex],v=norm($('answer').value),ok=(x.accept||[x.answer]).map(norm).includes(v);showFeedback(ok,ok?'正解です！':'もう一度考えてみましょう。');record(ok)}
let selected=[];function pickToken(el){selected.push({text:el.textContent,el});el.disabled=true;el.classList.add('used');renderBuilt()}function renderBuilt(){let tray=$('built');if(!tray)return;tray.classList.toggle('empty',selected.length===0);tray.innerHTML=selected.map((x,i)=>`<button class="built-token" onclick="removeToken(${i})">${x.text}</button>`).join('')}function removeToken(i){let[x]=selected.splice(i,1);if(x&&x.el){x.el.disabled=false;x.el.classList.remove('used')}renderBuilt()}function resetOrder(){selected=[];renderTraining()}function checkOrder(){let x=lessons[lessonIndex].items[itemIndex],built=selected.map(v=>v.text).join(' '),ok=norm(built)===norm(x.answer);showFeedback(ok,ok?'正しい英文です！':'使わない語が混ざっていないか、語順を見直してみましょう。');if($('exp'))$('exp').classList.remove('hidden');record(ok)}
function chooseReflection(el){document.querySelectorAll('#training-body .choice').forEach(e=>e.classList.remove('correct'));el.classList.add('correct');let f=$('fb');f.className='feedback good';f.textContent='いいですね。声に出して1回読んでみましょう。'}
function showFeedback(ok,msg){let f=$('fb');f.className='feedback '+(ok?'good':'bad');f.textContent=msg||(ok?'正解です！':'惜しいです。正解と比べてみましょう。')}
function next(){let n=lessons[lessonIndex].items.length;if(itemIndex<n-1){itemIndex++;renderTraining()}else{alert('この動画のレッスンは完了です。同じカテゴリの次の動画にも挑戦してみましょう！')}}function prev(){if(itemIndex>0){itemIndex--;renderTraining()}}
function startReview(){if(!wrong.length){$('review-message').textContent='現在、復習待ちの苦手問題はありません。';return}let key=wrong[0],split=key.lastIndexOf('-'),lid=key.slice(0,split),idx=Number(key.slice(split+1)),li=lessons.findIndex(l=>l.id===lid);loadLesson(li);itemIndex=idx;renderTraining();$('review-message').textContent=`苦手問題が ${wrong.length} 問あります。まず1問目を表示しました。`}
function updateStats(){$('learned-count').textContent=done.length;$('exam-count').textContent=learned.size;$('rate-count').textContent=attempts?Math.round(corrects/attempts*100)+'%':'0%';let total=lessons.reduce((a,l)=>a+l.items.filter(x=>x.kind!=='watch'&&x.kind!=='reflect').length,0);$('all-progress').style.width=Math.min(100,done.length/total*100)+'%';$('review-message').textContent=wrong.length?`苦手問題が ${wrong.length} 問あります。最後にもう一度挑戦しましょう。`:'間違えた問題はここにたまります。最後にもう一度挑戦しましょう。'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}window.onload=init;
</script></body></html>
