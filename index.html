<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TED-Edで英語を学ぶ</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --success-color: #10b981;
      --success-bg: #f0fdf4;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
      color: var(--text-main);
      line-height: 1.6;
      margin: 0;
      padding: 24px 16px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      color: var(--primary);
    }

    header p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    .progress-status {
      margin-top: 18px;
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .progress-bar-container {
      background-color: #edf2f7;
      border-radius: 9999px;
      height: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar {
      background-color: var(--success-color);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .selector-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .selector-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .video-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .video-selector button {
      background: #f7fafc;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .video-selector button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 24px;
      background: #1a202c;
    }

    .player-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    .vocab-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      border: 1px solid var(--border-color);
    }

    .vocab-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--primary);
      margin: 0 0 12px 0;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .vocab-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .vocab-word {
      font-weight: bold;
      color: #1a202c;
      font-size: 0.95rem;
    }

    .vocab-meaning {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .section-heading {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 6px;
      color: var(--primary);
      margin-bottom: 16px;
      font-size: 1.15rem;
      font-weight: bold;
    }

    .transcript-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .card.completed {
      border-left: 5px solid var(--success-color);
      background-color: var(--success-bg);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.78em;
      font-weight: bold;
    }

    .status-badge {
      color: var(--success-color);
      font-weight: bold;
      font-size: 0.88em;
    }

    .en-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .jp-text {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
    }

    button.btn-secondary {
      background: #718096;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .quiz-box {
      margin-top: 14px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 8px;
      display: none;
      border: 1px dashed #cbd5e1;
    }

    .quiz-instruction {
      margin: 0 0 10px 0;
      font-size: 0.88rem;
      color: #4a5568;
    }

    .quiz-input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      width: 150px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>TED-Edで英語を学ぶ</h1>
    <p>興味のあるテーマで耳と目を慣らし、必須フレーズを確実に定着させよう</p>
    <div class="progress-status" id="progress-text">進捗状況: 0 / 0 フレーズ完了 (0%)</div>
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
  </header>

  <div class="selector-card">
    <div class="selector-title">学習テーマを選択</div>
    <div class="video-selector" id="video-selector"></div>
  </div>

  <div class="player-container" id="player-frame"></div>

  <div class="vocab-section">
    <div class="vocab-title">📚 このテーマの重要単語・英検必須フレーズ (10語)</div>
    <div class="vocab-grid" id="vocab-grid"></div>
  </div>

  <div class="section-heading" id="current-video-title">フレーズリスト</div>
  <div class="transcript-list" id="transcript-list"></div>
</div>

<script>
// --- TED-Ed 公式の永続動画リスト＆学習データ ---
const tedData = [
  {
    id: "v_beauty",
    category: "美容・科学",
    title: "日焼け止めと肌の保護 (Sunscreen Protection)",
    youtubeId: "ZSJITdsTze0",
    vocabulary: [
      { word: "ultraviolet (形)", meaning: "紫外線の (UV)" },
      { word: "damage (動)", meaning: "〜にダメージを与える" },
      { word: "create (動)", meaning: "〜を創り出す、生み出す" },
      { word: "barrier (名)", meaning: "バリア、障壁" },
      { word: "absorb (動)", meaning: "〜を吸収する" },
      { word: "reflect (動)", meaning: "〜を反射する" },
      { word: "prevent (動)", meaning: "〜を防ぐ、予防する" },
      { word: "aging (名)", meaning: "老化、加齢" },
      { word: "apply (動)", meaning: "（薬や塗料を）塗る" },
      { word: "regularly (副)", meaning: "定期的に、習慣的に" }
    ],
    scripts: [
      {
        id: "vb_1",
        en: "Ultraviolet rays from the sun can damage your skin cells.",
        jp: "太陽からの紫外線は、肌の細胞にダメージを与える可能性があります。",
        blankWord: "damage", hint: "「〜に損害を与える」という意味の動詞"
      },
      {
        id: "vb_2",
        en: "Sunscreen creates a barrier that absorbs or reflects UV radiation.",
        jp: "日焼け止めは、紫外線を吸収または反射するバリア（障壁）を作ります。",
        blankWord: "creates", hint: "「〜を作り出す」という意味の動詞"
      },
      {
        id: "vb_3",
        en: "By applying sunscreen, you can prevent premature skin aging.",
        jp: "日焼け止めを塗ることで、肌の早期の老化を防ぐことができます。",
        blankWord: "prevent", hint: "「〜を防ぐ」という意味の動詞"
      },
      {
        id: "vb_4",
        en: "It is essential to apply it regularly throughout the day.",
        jp: "一日を通して定期的に塗り直すことが不可欠です。",
        blankWord: "regularly", hint: "「定期的に」という意味の副詞"
      },
      {
        id: "vb_5",
        en: "Protecting your skin today helps keep it healthy in the future.",
        jp: "今日肌を守ることは、将来健康な状態を保つことに役立ちます。",
        blankWord: "healthy", hint: "「健康な」という意味の形容詞"
      }
    ]
  },
  {
    id: "v_practice",
    category: "成長・科学",
    title: "効果的に練習する方法 (How to Practice Effectively)",
    youtubeId: "f2O6mQkFiiw",
    vocabulary: [
      { word: "master (動)", meaning: "〜を習得する、極める" },
      { word: "effective (形)", meaning: "効果的な" },
      { word: "consistent (形)", meaning: "一貫した、継続的な" },
      { word: "focus (動)", meaning: "集中する" },
      { word: "target (動)", meaning: "〜を標的・対象にする" },
      { word: "repetition (名)", meaning: "反復、繰り返し" },
      { word: "pathway (名)", meaning: "経路、回路" },
      { word: "brain (名)", meaning: "脳" },
      { word: "improve (動)", meaning: "〜を上達させる、改善する" },
      { word: "habit (名)", meaning: "習慣" }
    ],
    scripts: [
      {
        id: "vp_1",
        en: "Mastering any new skill takes time and effective practice.",
        jp: "新しいスキルをマスターするには、時間と効果的な練習が必要です。",
        blankWord: "effective", hint: "「効果的な」という意味の形容詞"
      },
      {
        id: "vp_2",
        en: "Effective practice should be consistent and intensely focused.",
        jp: "効果的な練習は、一貫性があり、非常に集中したものであるべきです。",
        blankWord: "consistent", hint: "「一貫した」という意味の形容詞"
      },
      {
        id: "vp_3",
        en: "Repetition is the key to building strong neural pathways in the brain.",
        jp: "反復こそが、脳内に強い神経回路を築く鍵となります。",
        blankWord: "Repetition", hint: "「反復」という意味の名詞"
      },
      {
        id: "vp_4",
        en: "Focusing on difficult parts helps you improve much faster.",
        jp: "難しい部分に集中することで、ずっと早く上達することができます。",
        blankWord: "improve", hint: "「上達する」という意味の動詞"
      }
    ]
  },
  {
    id: "v_ww1",
    category: "近代史",
    title: "第一次世界大戦の歴史 (World War I History)",
    youtubeId: "Cd2ch5ohh84",
    vocabulary: [
      { word: "trigger (動)", meaning: "〜を引き起こす" },
      { word: "conflict (名)", meaning: "紛争、争い" },
      { word: "complex (形)", meaning: "複雑な" },
      { word: "alliance (名)", meaning: "同盟" },
      { word: "tension (名)", meaning: "緊張" },
      { word: "increase (動)", meaning: "高まる、増加する" },
      { word: "declare (動)", meaning: "〜を宣言する" },
      { word: "spread (動)", meaning: "広がる" },
      { word: "impact (名)", meaning: "影響、衝撃" },
      { word: "nation (名)", meaning: "国家、国" }
    ],
    scripts: [
      {
        id: "vw1_1",
        en: "A single event in 1914 triggered a global conflict.",
        jp: "1914年のたった一つの出来事が、世界的な紛争を引き起こしました。",
        blankWord: "conflict", hint: "「紛争、争い」という意味の名詞"
      },
      {
        id: "vw1_2",
        en: "Political tensions had been increasing across Europe for years.",
        jp: "ヨーロッパ全土で政治的緊張が何年も高まっていました。",
        blankWord: "increasing", hint: "「高まる」という意味の動詞（進行形）"
      },
      {
        id: "vw1_3",
        en: "Complex alliances led multiple countries into the war.",
        jp: "複雑な同盟関係が、多くの国々を戦争へと引き込みました。",
        blankWord: "countries", hint: "「国々（countryの複数形）」"
      },
      {
        id: "vw1_4",
        en: "The war spread rapidly, changing global history forever.",
        jp: "戦争は急速に広がり、世界の歴史を永久に変えてしまいました。",
        blankWord: "spread", hint: "「広がる」という意味の動詞"
      }
    ]
  }
];

let currentVideoIndex = 0;
let completedList = JSON.parse(localStorage.getItem('english_paper_app_completed') || '[]');

function initApp() {
  renderVideoSelector();
  loadVideo(0);
}

function renderVideoSelector() {
  const container = document.getElementById('video-selector');
  container.innerHTML = '';
  tedData.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.innerText = `[${item.category}] ${item.title}`;
    btn.className = index === currentVideoIndex ? 'active' : '';
    btn.onclick = () => loadVideo(index);
    container.appendChild(btn);
  });
}

function loadVideo(index) {
  currentVideoIndex = index;
  const data = tedData[index];
  
  const frameContainer = document.getElementById('player-frame');
  frameContainer.innerHTML = `
    <iframe id="yt-iframe" src="https://www.youtube.com/embed/${data.youtubeId}?rel=0" allowfullscreen></iframe>
  `;

  document.getElementById('current-video-title').innerText = `${data.title} - フレーズ学習`;
  renderVideoSelector();
  renderVocabulary(data.vocabulary);
  renderScripts();
  updateProgress();
}

function renderVocabulary(vocabList) {
  const container = document.getElementById('vocab-grid');
  container.innerHTML = '';
  if (!vocabList) return;

  vocabList.forEach(v => {
    const card = document.createElement('div');
    card.className = 'vocab-card';
    card.innerHTML = `
      <div class="vocab-word">${v.word}</div>
      <div class="vocab-meaning">${v.meaning}</div>
    `;
    container.appendChild(card);
  });
}

function renderScripts() {
  const container = document.getElementById('transcript-list');
  container.innerHTML = '';
  const currentData = tedData[currentVideoIndex];

  currentData.scripts.forEach((s, i) => {
    const isDone = completedList.includes(s.id);
    const card = document.createElement('div');
    card.className = `card ${isDone ? 'completed' : ''}`;
    
    const maskedEn = s.en.replace(new RegExp(`\\b${s.blankWord}\\b`, 'gi'), '_____');

    card.innerHTML = `
      <div class="card-header">
        <span class="badge">Phrase ${i + 1}</span>
        ${isDone ? '<span class="status-badge">✓ クリア済</span>' : ''}
      </div>
      <div class="en-text">${s.en}</div>
      <div class="jp-text">${s.jp}</div>
      <div class="actions">
        <button class="btn-primary" onclick="speakText('${s.en.replace(/'/g, "\\'")}', 1.0)">🔊 英語音声を聴く</button>
        <button class="btn-primary" style="background:#64748b;" onclick="speakText('${s.en.replace(/'/g, "\\'")}', 0.8)">ゆっくり聴く (0.8x)</button>
        <button class="btn-secondary" onclick="toggleQuiz('${s.id}')">✍️ 穴埋めチェック</button>
      </div>
      <div class="quiz-box" id="quiz-${s.id}">
        <p class="quiz-instruction">
          カッコに入る英単語を入力してください。<br>
          <strong>${maskedEn}</strong><br>
          <small style="color:var(--text-sub);">ヒント: ${s.hint}</small>
        </p>
        <div class="quiz-input-group">
          <input type="text" id="input-${s.id}" placeholder="英単語を入力">
          <button class="btn-primary" onclick="checkAnswer('${s.id}', '${s.blankWord}')">判定</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// ブラウザ標準のクリアな英文音声読み上げ（Web Speech API）
function speakText(text, rate) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel(); // 前の音声をクリア
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'en-US';
    uttr.rate = rate || 1.0;
    window.speechSynthesis.speak(uttr);
  } else {
    alert("お使いのブラウザは音声読み上げ機能に対応していません。");
  }
}

function toggleQuiz(id) {
  const box = document.getElementById(`quiz-${id}`);
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function checkAnswer(id, correct) {
  const inputEl = document.getElementById(`input-${id}`);
  const inputVal = inputEl.value.trim().toLowerCase();
  
  if (inputVal === correct.toLowerCase()) {
    alert("正解です！クリアに登録しました。");
    if (!completedList.includes(id)) {
      completedList.push(id);
      localStorage.setItem('english_paper_app_completed', JSON.stringify(completedList));
    }
    renderScripts();
    updateProgress();
  } else {
    alert("惜しい！もう一度音声を聞いて確かめてみよう。");
  }
}

function updateProgress() {
  let totalPhrases = 0;
  tedData.forEach(item => {
    totalPhrases += item.scripts.length;
  });

  const completedCount = completedList.length;
  const percent = totalPhrases > 0 ? Math.round((completedCount / totalPhrases) * 100) : 0;

  document.getElementById('progress-text').innerText = `進捗状況: ${completedCount} / ${totalPhrases} フレーズ完了 (${percent}%)`;
  document.getElementById('progress-bar').style.width = `${percent}%`;
}

window.onload = () => {
  initApp();
};
</script>
</body>
</html>
